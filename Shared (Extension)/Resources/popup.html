<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CmdSwipe</title>
<style>
  :root {
    color-scheme: light dark;

    --bg:            light-dark(#f2f2f7, #1c1c1e);
    --card:          light-dark(#ffffff, #2c2c2e);
    --border:        light-dark(rgba(0,0,0,0.08), rgba(255,255,255,0.10));
    --text:          light-dark(#1d1d1f, #f5f5f7);
    --text-muted:    light-dark(#6e6e73, #98989d);
    --button-fill:   light-dark(rgba(0,0,0,0.05), rgba(255,255,255,0.07));
    --button-hover:  light-dark(rgba(0,0,0,0.09), rgba(255,255,255,0.13));
    --accent:        AccentColor;
    --accent-text:   AccentColorText;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: var(--bg); }

  body {
    width: 280px;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 13px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px 4px;
    letter-spacing: -0.01em;
  }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .section:last-of-type { margin-bottom: 0; }

  .label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 10px 0;
  }

  /* — Activation key — */

  .key-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .key-option {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    padding: 8px 2px 6px;
    border-radius: 7px;
    background: var(--button-fill);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.1;
    cursor: pointer;
    text-align: center;
    user-select: none;
    transition: background-color 0.1s ease;
  }
  .key-option:hover { background: var(--button-hover); }
  .key-option:focus { outline: none; }
  .key-option:focus-visible {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .key-option.selected {
    background: var(--accent);
    color: var(--accent-text);
  }
  .key-glyph {
    display: block;
    font-size: 15px;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .key-name {
    display: block;
    font-size: 10px;
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* — Threshold — */

  .threshold-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    margin: 0;
  }
  .threshold-input-wrap {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  input[type="number"] {
    width: 52px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--accent);
    accent-color: var(--accent);
  }
  .unit {
    font-size: 12px;
    color: var(--text-muted);
  }

  .range-meta {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <h1>CmdSwipe</h1>

  <div class="section">
    <div class="label">Activation Key</div>

    <div class="key-options" id="keyOptions">
      <button type="button" class="key-option" data-key="cmd">
        <span class="key-glyph">⌘</span><span class="key-name">Command</span>
      </button>
      <button type="button" class="key-option" data-key="option">
        <span class="key-glyph">⌥</span><span class="key-name">Option</span>
      </button>
      <button type="button" class="key-option" data-key="hyper">
        <span class="key-glyph">⌘⌥⌃⇧</span><span class="key-name">Hyper</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="label">Swipe Threshold</div>

    <div class="threshold-row">
      <input type="range" id="thresholdSlider" min="30" max="200" step="5">
      <div class="threshold-input-wrap">
        <input type="number" id="thresholdInput" min="30" max="200" step="5">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="range-meta">
      <span>Sensitive</span>
      <span>Deliberate</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
